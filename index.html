<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إرسال إلى تلغرام</title>
</head>
<body>

  <h2>إرسال رسالة</h2>

  <input id="msg" type="text" placeholder="اكتب الرسالة">

  <button onclick="sendMessage()">
    إرسال
  </button>

  <script>

    async function sendMessage() {

      const message = document.getElementById("msg").value;

      const response = await fetch("/api/order", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          firstName: "مستخدم",
          lastName: "",
          phone: "000000000",
          state: "البليدة",
          deliveryType: "office",
          shipping: 0,
          total: 0,
          productName: message
        })
      });

      const data = await response.json();

      console.log(data);

      if (data.ok) {
        alert("تم الإرسال");
      } else {
        alert("فشل الإرسال");
      }

    }

  </script>

</body>
</html>
