<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إرسال إلى تلغرام</title>
</head>
<body>

  <h2>إرسال رسالة إلى التلغرام</h2>

  <input id="msg" type="text" placeholder="اكتب الرسالة">

  <button id="btn">
    إرسال
  </button>

  <script>

    document.getElementById("btn").addEventListener("click", async function () {

      const msg = document.getElementById("msg").value;

      if (!msg) {
        alert("اكتب رسالة");
        return;
      }

      try {

        const response = await fetch("/api/order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            firstName: "نصيب",
            lastName: "تجربة",
            phone: "0555555555",
            state: "البليدة",
            deliveryType: "office",
            shipping: 0,
            total: 0,
            productName: msg
          })
        });

        const data = await response.json();

        console.log(data);

        if (data.ok) {
          alert("تم الإرسال");
        } else {
          alert("فشل الإرسال");
        }

      } catch (error) {

        console.log(error);

        alert("خطأ");

      }

    });

  </script>

</body>
</html>
