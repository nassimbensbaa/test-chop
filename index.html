<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إرسال إلى تلغرام</title>
</head>
<body>

  <h3>اكتب رسالة</h3>

  <input id="msg" type="text" placeholder="اكتب هنا">
  <button onclick="send()">إرسال</button>

  <script>
    async function send() {

      const message = document.getElementById("msg").value;

      if (!message) {
        alert("اكتب رسالة");
        return;
      }

      try {

        const response = await fetch("/api/send", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (data.ok === false) {
          alert("فشل الإرسال");
          console.log(data);
          return;
        }

        alert("تم الإرسال إلى التلغرام");

      } catch (error) {

        console.log(error);

        alert("حدث خطأ");

      }

    }
  </script>

</body>
</html>
